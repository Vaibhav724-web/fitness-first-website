<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generate Diet Plan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-5">
  <h2 class="mb-4">Generate Your Diet Plan</h2>
  <form action="generate_diet.php" method="POST">
    <div class="mb-3">
      <label class="form-label">Your Name</label>
      <input type="text" name="name" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Height (cm)</label>
      <input type="number" step="0.1" name="height" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Weight (kg)</label>
      <input type="number" step="0.1" name="weight" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-success">Generate Diet Plan</button>
  </form>
</div>
</body>
</html>
